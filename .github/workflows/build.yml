name: Build Plugin

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet publish --configuration Release --output ./build

      - name: Install jprm
        run: pip install jellyfin-plugin-repo-manager

      - name: Package plugin
        run: |
          jprm plugin build . --output ./dist

      - name: Create manifest
        run: |
          # Get the version from the tag or use 1.0.0.0
          VERSION=${GITHUB_REF_NAME#v}
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF_NAME" ]; then
            VERSION="1.0.0.0"
          fi

          # Create repo.json and rename to manifest.json
          jprm repo init ./repo
          jprm repo add ./repo/manifest.json ./dist/*.zip
          mv ./repo/manifest.json ./manifest.json

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: plugin-package
          path: |
            dist/*.zip
            manifest.json

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
          generate_release_notes: true

      - name: Update manifest in repo
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          # Update manifest.json with the actual GitHub release URL
          REPO="${{ github.repository }}"
          TAG="${{ github.ref_name }}"
          ZIP_NAME=$(ls dist/*.zip | xargs -n1 basename)

          # Replace the local path with the GitHub release URL
          sed -i "s|dist/${ZIP_NAME}|https://github.com/${REPO}/releases/download/${TAG}/${ZIP_NAME}|g" manifest.json

          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Commit and push manifest.json to main
          git fetch origin main
          git checkout main
          git add manifest.json
          git commit -m "Update manifest.json for ${TAG}" || echo "No changes to commit"
          git push origin main
